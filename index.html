

<!DOCTYPE html>

<html lang="uk">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

    <meta name="theme-color" content="#121318">

    <title>POWER / KYIV</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    
<style>
    :root {
        color-scheme: dark;
        --bg-color: #121318;
        --panel-bg: rgba(43,45,66,.72);
        --text-color: #F5F5F5;
        --muted-color: rgba(245,245,245,.76);
        --line-color: rgba(245,245,245,.16);
        --glass-edge: rgba(245,245,245,.28);
        --ambient-lime: rgba(198,255,0,.18);
        --ambient-red: rgba(255,61,87,.06);
        --ambient-surface: rgba(43,45,66,.55);
        --green: #C6FF00;
        --outage: #FF3D57;
        --yellow: #F5F5F5;
        --warning-text: #F5F5F5;
        --empty: #2B2D42;
        --active-tab: #C6FF00;
        --active-tab-text: #121318;
        --accent: #F5F5F5;
        --shadow: 0 16px 42px rgba(18,19,24,.26);
    }

    @media (prefers-color-scheme: light) {
        :root {
            color-scheme: light;
            --bg-color: #F5F5F5;
            --panel-bg: rgba(43,45,66,.08);
            --text-color: #121318;
            --muted-color: #2B2D42;
            --line-color: rgba(18,19,24,.12);
            --glass-edge: rgba(43,45,66,.2);
            --ambient-lime: rgba(198,255,0,.16);
            --ambient-red: rgba(255,61,87,.08);
            --ambient-surface: rgba(43,45,66,.06);
            --green: #C6FF00;
            --outage: #FF3D57;
            --yellow: #2B2D42;
            --warning-text: #121318;
            --empty: rgba(18,19,24,.12);
            --active-tab: #2B2D42;
            --active-tab-text: #F5F5F5;
            --accent: #FF3D57;
            --shadow: 0 8px 24px rgba(18,19,24,.07);
        }
    }

    * { box-sizing: border-box; }

    html {
        min-height: 100%;
        background: var(--bg-color);
    }

    body {
        min-height: 100vh;
        font-family: -apple-system, BlinkMacSystemFont,
            "SF Pro Display", "Segoe UI", Roboto, sans-serif;
        background:
            radial-gradient(ellipse at 88% 2%, var(--ambient-lime), transparent 38%),
            radial-gradient(ellipse at 6% 44%, var(--ambient-red), transparent 34%),
            radial-gradient(ellipse at 84% 88%, var(--ambient-surface), transparent 36%),
            var(--bg-color);
        background-attachment: fixed;
        color: var(--text-color);
        margin: 0;
        padding: max(20px, env(safe-area-inset-top))
                 16px
                 max(24px, env(safe-area-inset-bottom));
        user-select: none;
        -webkit-tap-highlight-color: transparent;
        letter-spacing: -.01em;
    }

    body > * {
        max-width: 620px;
        margin-left: auto;
        margin-right: auto;
    }

    .header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        margin-bottom: 20px;
        padding: 4px 2px;
    }

.header h1 {
        margin: 0 0 5px;
        font-size: 18px;
        letter-spacing: -.045em;
        font-weight: 800;
    }

    .detail {
        font-size: 12px;
        color: var(--muted-color);
        line-height: 1.55;
    }

    .group-select {
        appearance: none;
        -webkit-appearance: none;
        background-color: var(--panel-bg);
        color: var(--text-color);
        border: 1px solid var(--glass-edge);
        border-radius: 18px;
        padding: 11px 30px 11px 13px;
        font-size: 13px;
        font-weight: 650;
        max-width: 155px;
        outline: none;
        box-shadow: inset 0 1px 0 rgba(245,245,245,.1), var(--shadow);
        backdrop-filter: blur(18px) saturate(155%);
        -webkit-backdrop-filter: blur(18px) saturate(155%);
        background-image:
            linear-gradient(45deg, transparent 50%, var(--muted-color) 50%),
            linear-gradient(135deg, var(--muted-color) 50%, transparent 50%);
        background-position:
            calc(100% - 15px) 16px,
            calc(100% - 10px) 16px;
        background-size: 5px 5px, 5px 5px;
        background-repeat: no-repeat;
    }

    .tabs {
        display: flex;
        background: rgba(245,245,245,.045);
        backdrop-filter: blur(20px) saturate(160%);
        -webkit-backdrop-filter: blur(20px) saturate(160%);
        border-radius: 22px;
        padding: 4px;
        gap: 4px;
        margin-bottom: 14px;
        border: 1px solid var(--glass-edge);
        box-shadow: inset 0 1px 0 rgba(245,245,245,.1);
    }

    .tab-btn {
        flex: 1;
        min-height: 48px;
        padding: 13px 12px;
        font-size: 15px;
        font-weight: 650;
        border-radius: 16px;
        border: 0;
        background: transparent;
        color: var(--muted-color);
        transition: background .2s, color .2s, transform .15s;
        cursor: pointer;
    }

    .tab-btn.active {
        background: var(--active-tab);
        color: var(--active-tab-text);
        font-weight: 750;
        box-shadow: inset 0 1px 0 rgba(245,245,245,.2), 0 3px 12px rgba(18,19,24,.12);
    }

    .card {
        background: var(--panel-bg);
        border: 1px solid var(--glass-edge);
        border-radius: 28px;
        padding: 19px;
        margin-bottom: 14px;
        box-shadow: inset 0 1px 0 rgba(245,245,245,.12), var(--shadow);
        backdrop-filter: blur(26px) saturate(165%);
        -webkit-backdrop-filter: blur(26px) saturate(165%);
    }

    .status-card { padding: 22px; }
    .status-card[data-state="on"] .headline { color: var(--text-color); }
    .status-card[data-state="off"] .headline { color: var(--text-color); }
    .status-card[data-state="unknown"] .headline { color: var(--text-color); }
    .status-card #detail-text { padding-left: 19px; font-size: 14px; }
    .countdown {
        display: flex;
        align-items: center;
        gap: 9px;
        width: fit-content;
        max-width: 100%;
        margin: 11px 0 0 19px;
        padding: 9px 12px;
        border: 1px solid var(--glass-edge);
        border-radius: 18px;
        background: var(--panel-bg);
        color: var(--text-color);
        font-size: 13px;
        font-weight: 700;
        font-variant-numeric: tabular-nums;
        line-height: 1.35;
        backdrop-filter: blur(18px) saturate(150%);
        -webkit-backdrop-filter: blur(18px) saturate(150%);
    }
    .countdown::before {
        content: "";
        flex: 0 0 8px;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--text-color);
    }
    .countdown[data-state="off"]::before { background: var(--outage); }
    .countdown[data-state="on"]::before { background: var(--green); }
    .headline {
        font-size: 19px;
        font-weight: 750;
        letter-spacing: -.035em;
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 7px;
    }

    .badge {
        display: inline-block;
        flex: 0 0 9px;
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: var(--yellow);
        box-shadow: 0 0 0 4px rgba(245,245,245,.12);
    }

    .headline .badge {
        width: 10px;
        height: 10px;
        flex-basis: 10px;
    }

    #detail-text { font-size: 13px; }

    .timeline {
        display: flex;
        gap: 3px;
        height: 10px;
        margin: 20px 0 9px;
    }

    .timeline-legend { display:flex; flex-wrap:wrap; gap:8px 16px; margin-top:14px; color:var(--muted-color); font-size:11px; }
    .legend-item { display:inline-flex; align-items:center; gap:7px; }
    .legend-swatch { width:8px; height:8px; border-radius:50%; }
    .timeline-seg {
        flex: 1;
        min-width: 0;
        border-radius: 999px;
        background: var(--empty);
        transition: opacity .2s;
    }

    .timeline-seg.current {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
        z-index: 1;
    }

    .ticks {
        display: grid;
        grid-template-columns: repeat(9, minmax(0, 1fr));
        font-size: 10px;
        font-weight: 600;
        color: var(--muted-color);
        margin: 0;
    }

    .ticks span {
        position: relative;
        text-align: center;
    }

    .ticks span::before {
        content: "";
        position: absolute;
        left: 50%;
        top: -5px;
        height: 4px;
        width: 1px;
        background: var(--muted-color);
        opacity: .45;
    }

    .ticks span:first-child { text-align: left; }
    .ticks span:last-child { text-align: right; }

    .ticks-note {
        margin-top: 8px;
        color: var(--muted-color);
        font-size: 10px;
        line-height: 1.4;
    }

    .period-row {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        align-items: center;
        gap: 4px 12px;
        padding: 14px 0;
        border-bottom: 1px solid var(--line-color);
        font-size: 14px;
    }

    .period-row:last-child {
        border-bottom: none;
        padding-bottom: 1px;
    }

    .period-time {
        font-weight: 700;
        display: flex;
        align-items: center;
        gap: 9px;
        white-space: nowrap;
        font-variant-numeric: tabular-nums;
    }

    .period-time .badge { box-shadow: none; }
    .period-row .period-label { grid-column: 1; padding-left: 19px; font-size: 12px; text-align: left; }

    .period-row .detail {
        text-align: right;
        font-size: 11px;
    }

    .group-select {
        appearance: none;
        -webkit-appearance: none;
        background-color: var(--panel-bg);
        color: var(--text-color);
        border: 1px solid var(--glass-edge);
        border-radius: 18px;
        padding: 11px 30px 11px 13px;
        font-size: 13px;
        font-weight: 650;
        max-width: 155px;
        outline: none;
        box-shadow: inset 0 1px 0 rgba(245,245,245,.1), var(--shadow);
        backdrop-filter: blur(18px) saturate(155%);
        -webkit-backdrop-filter: blur(18px) saturate(155%);
        background-image:
            linear-gradient(45deg, transparent 50%, var(--muted-color) 50%),
            linear-gradient(135deg, var(--muted-color) 50%, transparent 50%);
        background-position:
            calc(100% - 15px) 16px,
            calc(100% - 10px) 16px;
        background-size: 5px 5px, 5px 5px;
        background-repeat: no-repeat;
    }

    .data-warning:not([hidden]) {
        display: block;
        margin-bottom: 14px;
        padding: 12px 14px;
        border: 1px solid var(--glass-edge);
        border-radius: 18px;
        background: var(--panel-bg);
        color: var(--warning-text);
        font-size: 12px;
        line-height: 1.45;
        backdrop-filter: blur(18px);
        -webkit-backdrop-filter: blur(18px);
    }

    .data-warning[hidden] { display: none; }
    .btn-refresh {
        display: block;
        width: 100%;
        min-height: 54px;
        padding: 16px;
        border-radius: 21px;
        border: 1px solid var(--glass-edge);
        background: var(--panel-bg);
        color: var(--text-color);
        backdrop-filter: blur(22px) saturate(160%);
        -webkit-backdrop-filter: blur(22px) saturate(160%);
        box-shadow: inset 0 1px 0 rgba(245,245,245,.11), var(--shadow);
        font-size: 16px;
        font-weight: 700;
        margin: 14px auto 0;
        cursor: pointer;
        transition: opacity .2s, transform .15s;
    }

    .btn-refresh:disabled { opacity: .55; }

    button, select { font-family: inherit; }

    button:active { transform: scale(.985); }

    button:focus-visible,
    select:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 3px;
    }

    @media (max-width: 360px) {
        body {
            padding-left: 12px;
            padding-right: 12px;
        }

        .card {
            padding: 16px;
            border-radius: 24px;
        }

        .headline { font-size: 17px; }

        .period-row { gap: 8px; }
        .period-row .period-label { font-size: 11px; }
    }

    @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
            transition-duration: .01ms !important;
        }
    }

    :root[data-theme="dark"] {
        color-scheme: dark;
        --bg-color: #121318; --panel-bg: rgba(43,45,66,.72); --text-color: #F5F5F5;
        --muted-color: rgba(245,245,245,.76); --line-color: rgba(245,245,245,.16);
        --glass-edge: rgba(245,245,245,.28); --ambient-lime: rgba(198,255,0,.18);
        --ambient-red: rgba(255,61,87,.06); --ambient-surface: rgba(43,45,66,.55);
        --green: #C6FF00; --outage: #FF3D57; --yellow: #F5F5F5;
        --warning-text: #F5F5F5; --empty: #2B2D42; --active-tab: #C6FF00;
        --active-tab-text: #121318; --accent: #F5F5F5; --shadow: 0 16px 42px rgba(18,19,24,.26);
    }
    :root[data-theme="light"] {
        color-scheme: light;
        --bg-color: #F5F5F5; --panel-bg: rgba(43,45,66,.08); --text-color: #121318;
        --muted-color: #2B2D42; --line-color: rgba(18,19,24,.12); --glass-edge: rgba(43,45,66,.2);
        --ambient-lime: rgba(198,255,0,.16); --ambient-red: rgba(255,61,87,.08);
        --ambient-surface: rgba(43,45,66,.06); --green: #C6FF00; --outage: #FF3D57;
        --yellow: #2B2D42; --warning-text: #121318; --empty: rgba(18,19,24,.12);
        --active-tab: #2B2D42; --active-tab-text: #F5F5F5; --accent: #FF3D57;
        --shadow: 0 8px 24px rgba(18,19,24,.07);
    }
    .header-tools { display:flex; align-items:center; gap:8px; }
    .settings-toggle, .setting-action {
        min-height:42px; padding:9px 12px; border:1px solid var(--glass-edge);
        border-radius:16px; background:var(--panel-bg); color:var(--text-color);
        font-size:13px; font-weight:700; cursor:pointer;
        backdrop-filter:blur(18px) saturate(155%); -webkit-backdrop-filter:blur(18px) saturate(155%);
    }
    .settings-toggle[aria-expanded="true"] { border-color:var(--accent); }
    .settings-panel[hidden] { display:none; }
    .settings-panel { padding:16px; }
    .settings-title { margin-bottom:12px; font-weight:750; }
    .setting-row {
        display:flex; justify-content:space-between; align-items:center; gap:12px;
        padding:9px 0; color:var(--text-color); font-size:14px;
    }
    .setting-select {
        min-height:40px; max-width:175px; padding:8px 11px;
        border:1px solid var(--glass-edge); border-radius:14px;
        background:var(--panel-bg); color:var(--text-color); font:inherit;
    }
    .setting-check { display:flex; align-items:center; gap:10px; cursor:pointer; }
    .setting-check input { width:18px; height:18px; accent-color:var(--active-tab); }
    .setting-action { width:100%; margin-top:12px; }
    :root[data-text-size="large"] .detail { font-size:15px; }
    :root[data-text-size="large"] .header h1 { font-size:21px; }
    :root[data-text-size="large"] .tab-btn { min-height:54px; font-size:17px; }
    :root[data-text-size="large"] .headline { font-size:22px; }
    :root[data-text-size="large"] .status-card #detail-text { font-size:16px; }
    :root[data-text-size="large"] .countdown { font-size:15px; }
    :root[data-text-size="large"] .ticks,
    :root[data-text-size="large"] .ticks-note,
    :root[data-text-size="large"] .timeline-legend { font-size:13px; }
    :root[data-text-size="large"] .period-row { font-size:16px; }
    :root[data-text-size="large"] .period-row .period-label,
    :root[data-text-size="large"] .period-row .detail { font-size:14px; }
    :root[data-density="compact"] .header { margin-bottom:12px; }
    :root[data-density="compact"] .card { padding:14px; border-radius:22px; margin-bottom:10px; }
    :root[data-density="compact"] .status-card { padding:16px; }
    :root[data-density="compact"] .period-row { padding:9px 0; }
    :root[data-density="compact"] .timeline { margin-top:14px; }
</style>


</head>

<body>

    <div class="header">

        <div>

            <h1>POWER / KYIV</h1>

            <span id="update-label" class="detail">YASNO · оновлюю…</span>

        </div>

        <div class="header-tools">        <select id="group-select" class="group-select"

                aria-label="Вибір черги">

            <option value="35.1">Черга 35.1</option>

        </select>        <button id="settings-toggle" class="settings-toggle" type="button" aria-label="Налаштування вигляду" aria-expanded="false" aria-controls="settings-panel" title="Налаштування вигляду">⚙</button>
        </div>

    </div>

    <section id="settings-panel" class="card settings-panel" aria-label="Налаштування вигляду" hidden>
        <div class="settings-title">Налаштування вигляду</div>
        <label class="setting-row" for="theme-setting">
            <span>Тема</span>
            <select id="theme-setting" class="setting-select">
                <option value="auto">Як у Telegram / системі</option>
                <option value="dark">Темна</option>
                <option value="light">Світла</option>
            </select>
        </label>
        <label class="setting-row" for="text-size-setting">
            <span>Розмір тексту</span>
            <select id="text-size-setting" class="setting-select">
                <option value="normal">Звичайний</option>
                <option value="large">Збільшений</option>
            </select>
        </label>
        <label class="setting-row setting-check" for="compact-setting">
            <span>Компактне відображення</span>
            <input id="compact-setting" type="checkbox">
        </label>
        <button id="add-home-screen" class="setting-action" type="button" hidden>Додати ярлик на головний екран</button>
    </section>
    <div class="tabs">

        <button id="tab-today" class="tab-btn active"

                onclick="switchDay('today')">Сьогодні</button>

        <button id="tab-tomorrow" class="tab-btn"

                onclick="switchDay('tomorrow')">Завтра</button>

    </div>

    <div id="data-warning" class="data-warning" role="status"
         aria-live="polite" hidden></div>

    <div class="card status-card" id="status-card" data-state="unknown">

        <div class="headline">

            <span id="status-dot" class="badge"></span>

            <span id="headline-text">Завантаження...</span>

        </div>

        <div id="schedule-date" class="detail"></div>

        <div id="detail-text" class="detail">Отримання графіка...</div>

        <div id="countdown" class="countdown" role="timer" aria-live="off" hidden></div>

        <div id="timeline-bar" class="timeline"></div>

        <div class="ticks">
            <span>00</span><span>03</span><span>06</span>
            <span>09</span><span>12</span><span>15</span>
            <span>18</span><span>21</span><span>24</span>
        </div>
        <div class="ticks-note">24 години · кожен сегмент — 1 година</div>

        <div class="timeline-legend" aria-label="Пояснення графіка">
            <span class="legend-item"><i class="legend-swatch" style="background:var(--outage)"></i>Відключення</span>
            <span class="legend-item"><i class="legend-swatch" style="background:var(--green)"></i>Світло є</span>
            <span class="legend-item"><i class="legend-swatch" style="background:var(--yellow)"></i>Немає даних</span>
        </div>

    </div>

    <div class="card">

        <div style="font-size:12px;font-weight:600;color:var(--muted-color);margin-bottom:8px">

            ПЕРІОДИ ВІДКЛЮЧЕНЬ

        </div>

        <div id="intervals-container" class="detail">

            Завантаження...

        </div>

    </div>

    <button id="refresh-button" class="btn-refresh"

            onclick="loadDashboard({ forceRefresh: true })">↻ Оновити дані</button>

    <script>

        const tg = window.Telegram?.WebApp;

        if (tg) {

            tg.ready();

            tg.expand();

        }

        const SERVER = "https://svitlo-bot-ysac.onrender.com";

        const REFRESH_MS = 60000;

        let currentDay = "today";

        let loading = false;

        let refreshTimer = null;
        let countdownTarget = null;
        let countdownRefreshRequested = false;
        let countdownTimer = null;

        const $ = id => document.getElementById(id);
        const APPEARANCE_KEY = "svitlo_appearance_v1";
        function readAppearance() {
            const defaults = { theme: "auto", textSize: "normal", compact: false };
            try {
                const saved = JSON.parse(localStorage.getItem(APPEARANCE_KEY) || "{}");
                return {
                    theme: ["auto", "dark", "light"].includes(saved.theme) ? saved.theme : defaults.theme,
                    textSize: saved.textSize === "large" ? "large" : defaults.textSize,
                    compact: saved.compact === true
                };
            } catch { return defaults; }
        }
        let appearance = readAppearance();
        function applyAppearance() {
            const telegramTheme = tg?.colorScheme;
            const systemTheme = (telegramTheme === "light" || telegramTheme === "dark")
                ? telegramTheme
                : (window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
            document.documentElement.dataset.theme = appearance.theme === "auto" ? systemTheme : appearance.theme;
            document.documentElement.dataset.textSize = appearance.textSize;
            document.documentElement.dataset.density = appearance.compact ? "compact" : "comfortable";
            $("theme-setting").value = appearance.theme;
            $("text-size-setting").value = appearance.textSize;
            $("compact-setting").checked = appearance.compact;
        }
        function saveAppearance() {
            try { localStorage.setItem(APPEARANCE_KEY, JSON.stringify(appearance)); } catch {}
            applyAppearance();
        }
        applyAppearance();
        $("settings-toggle").addEventListener("click", () => {
            const panel = $("settings-panel");
            panel.hidden = !panel.hidden;
            $("settings-toggle").setAttribute("aria-expanded", String(!panel.hidden));
        });
        $("theme-setting").addEventListener("change", event => {
            appearance.theme = event.target.value;
            saveAppearance();
        });
        $("text-size-setting").addEventListener("change", event => {
            appearance.textSize = event.target.value;
            saveAppearance();
        });
        $("compact-setting").addEventListener("change", event => {
            appearance.compact = event.target.checked;
            saveAppearance();
        });
        if (tg && typeof tg.addToHomeScreen === "function") {
            const homeScreenButton = $("add-home-screen");
            homeScreenButton.hidden = false;
            homeScreenButton.addEventListener("click", () => tg.addToHomeScreen());
            tg.onEvent?.("homeScreenAdded", () => {
                homeScreenButton.textContent = "Ярлик додано на головний екран";
                homeScreenButton.disabled = true;
            });
            tg.onEvent?.("homeScreenFailed", () => {
                homeScreenButton.textContent = "Не вдалося додати ярлик — спробуйте з меню Telegram";
            });
        }
        tg?.onEvent?.("themeChanged", applyAppearance);

        function readSavedGroup() {

            try {

                return localStorage.getItem("selected_group") || "35.1";

            } catch {

                return "35.1";

            }

        }

        let currentGroup = readSavedGroup();

        // Київський час незалежно від часового поясу пристрою.

        function kyivParts() {

            const parts = new Intl.DateTimeFormat("en-GB", {

                timeZone: "Europe/Kyiv",

                hour: "2-digit",

                minute: "2-digit",
                second: "2-digit",
                hourCycle: "h23"

            }).formatToParts(new Date());

            const get = type => Number(

                parts.find(p => p.type === type)?.value || 0

            );

            return { hour: get("hour"), minute: get("minute"), second: get("second") };

        }

        function formatKyivTimestamp(value) {

            if (!value) return "час невідомий";

            const date = new Date(value);

            if (Number.isNaN(date.getTime())) return String(value);

            return new Intl.DateTimeFormat("uk-UA", {
                timeZone: "Europe/Kyiv",
                dateStyle: "short",
                timeStyle: "short"
            }).format(date);

        }

        function formatScheduleDate(value) {

            if (!value) return "Дата графіка не вказана";

            const dateOnly = String(value).match(/^(\d{4})-(\d{2})-(\d{2})$/);

            const date = dateOnly
                ? new Date(Date.UTC(
                    Number(dateOnly[1]),
                    Number(dateOnly[2]) - 1,
                    Number(dateOnly[3]),
                    12
                ))
                : new Date(value);

            if (Number.isNaN(date.getTime())) return String(value);

            return new Intl.DateTimeFormat("uk-UA", {
                timeZone: "Europe/Kyiv",
                day: "numeric",
                month: "long",
                year: "numeric"
            }).format(date);

        }

        function scheduleStatusLabel(status) {

            const labels = {
                ScheduleApplies: "Графік відключень діє",
                WaitingForSchedule: "Графік очікується",
                NoShutdowns: "Планових відключень немає",
                PlannedShutdowns: "Є планові відключення",
                EmergencyShutdowns: "Аварійні відключення"
            };

            return labels[status] || "Статус уточнюється";

        }

        function updateScheduleDate(data) {

            const dayLabel = currentDay === "today" ? "Сьогодні" : "Завтра";

            $("schedule-date").textContent =
                dayLabel + " · " + formatScheduleDate(data.date) +
                " · Черга " + currentGroup;

        }

        function updateDataState(data) {

            const fetchedAt = formatKyivTimestamp(data.dataFetchedAt);
            const sourceUpdatedAt = data.updatedOn
                ? formatKyivTimestamp(data.updatedOn)
                : null;
            const fetchedDate = data.dataFetchedAt ? new Date(data.dataFetchedAt) : null;
            const fetchedTime = fetchedDate && !Number.isNaN(fetchedDate.getTime())
                ? new Intl.DateTimeFormat("uk-UA", {
                    timeZone: "Europe/Kyiv", hour: "2-digit", minute: "2-digit"
                }).format(fetchedDate)
                : null;

            $("update-label").textContent = fetchedTime
                ? "YASNO · оновлено о " + fetchedTime
                : "YASNO · час оновлення невідомий";
            $("update-label").title = sourceUpdatedAt
                ? "Джерело оновило графік: " + sourceUpdatedAt + " за Києвом"
                : "Час показано за Києвом";

            const warning = $("data-warning");
            warning.hidden = !data.dataIsStale;
            warning.textContent = data.dataIsStale
                ? "Не вдалося оновити дані. Показано кеш від " +
                    fetchedAt + " за київським часом."
                : "";

        }

        function hhmm(minutes) {

            const h = Math.floor(minutes / 60);

            const m = minutes % 60;

            return `${String(h).padStart(2, "0")}:${String(m).padStart(2, "0")}`;

        }

        function clearCountdown() {
            countdownTarget = null;
            countdownRefreshRequested = false;
            $("countdown").hidden = true;
            $("countdown").textContent = "";
        }

        function updateScheduleCountdown(slots, nowMinutes, data) {
            const supportedStatuses = [
                "WaitingForSchedule",
                "ScheduleApplies",
                "NoShutdowns",
                "PlannedShutdowns"
            ];

            if (
                currentDay !== "today" ||
                data.dataIsStale ||
                !supportedStatuses.includes(data.status)
            ) {
                clearCountdown();
                return;
            }

            const activeOutage = slots.find(slot =>
                isOutage(slot) &&
                nowMinutes >= slot.start &&
                nowMinutes < slot.end
            );

            if (activeOutage) {
                countdownTarget = {
                    minutes: activeOutage.end,
                    state: "on",
                    label: "До ввімкнення за графіком"
                };
            } else {
                const nextOutage = slots
                    .filter(slot => isOutage(slot) && slot.start > nowMinutes)
                    .sort((a, b) => a.start - b.start)[0];

                if (!nextOutage) {
                    clearCountdown();
                    return;
                }

                countdownTarget = {
                    minutes: nextOutage.start,
                    state: "off",
                    label: "До вимкнення за графіком"
                };
            }

            countdownRefreshRequested = false;
            renderCountdown();
        }

        function renderCountdown() {
            const element = $("countdown");

            if (!countdownTarget) {
                element.hidden = true;
                return;
            }

            const { hour, minute, second } = kyivParts();
            const nowSeconds = hour * 3600 + minute * 60 + second;
            const remaining = countdownTarget.minutes * 60 - nowSeconds;

            element.hidden = false;
            element.dataset.state = countdownTarget.state;

            if (remaining <= 0) {
                element.textContent =
                    countdownTarget.label + " · час настав, оновлюю графік…";

                if (!countdownRefreshRequested) {
                    countdownRefreshRequested = true;
                    setTimeout(() => loadDashboard(), 1200);
                }

                return;
            }

            const hours = Math.floor(remaining / 3600);
            const minutes = Math.floor((remaining % 3600) / 60);
            const seconds = remaining % 60;
            const duration = hours > 0
                ? hours + " год " + String(minutes).padStart(2, "0") + " хв"
                : minutes + " хв " + String(seconds).padStart(2, "0") + " с";

            element.textContent = countdownTarget.label + " · " + duration;
        }
        function normalizeType(slot) {

            return String(slot?.type || "")

                .toLowerCase()

                .replace(/[\s_-]/g, "");

        }

        function isOutage(slot) {

            return normalizeType(slot) === "definite";

        }

        function isNotPlanned(slot) {

            return normalizeType(slot) === "notplanned";

        }

        function validSlot(slot) {

            return Number.isFinite(slot?.start) &&

                Number.isFinite(slot?.end) &&

                slot.start >= 0 &&

                slot.end <= 1440 &&

                slot.end > slot.start;

        }

        function setError(message) {

            clearCountdown();

            $("status-dot").style.backgroundColor = "var(--yellow)";
            $("headline-text").innerText = "Немає актуальних даних";
            $("status-card").dataset.state = "unknown";
            $("schedule-date").textContent = "";
            $("detail-text").innerText = message;
            $("timeline-bar").replaceChildren();
            $("intervals-container").innerText = message;
            $("update-label").textContent = "YASNO · помилка оновлення";

            const warning = $("data-warning");
            warning.hidden = false;
            warning.textContent = message;

        }

        async function apiGet(path) {

            const response = await fetch(
                `${SERVER}${path}`,
                { cache: "no-store" }
            );

            const data = await response.json().catch(() => ({}));

            if (!response.ok) {
                throw new Error(data.error || "Помилка сервера: HTTP " + response.status);
            }

            return data;

        }

        async function fetchGroupsList() {

            try {

                const data = await apiGet("/groups");

                if (!Array.isArray(data.groups) || data.groups.length === 0) {

                    return;

                }

                const select = $("group-select");

                select.replaceChildren();

                data.groups.forEach(group => {

                    const option = document.createElement("option");

                    option.value = String(group);

                    option.textContent = `Черга ${group}`;

                    select.appendChild(option);

                });

                if (data.groups.map(String).includes(currentGroup)) {

                    select.value = currentGroup;

                } else {

                    currentGroup = String(data.groups[0]);

                    select.value = currentGroup;

                    saveGroup();

                }

            } catch (error) {

                console.error("Не вдалося завантажити черги:", error);

                // Якщо /groups недоступний, залишаємо поточний варіант.

            }

        }

        function saveGroup() {

            try {

                localStorage.setItem("selected_group", currentGroup);

            } catch {}

        }

        function switchDay(day) {

            clearCountdown();

            currentDay = day;

            $("tab-today").classList.toggle("active", day === "today");

            $("tab-tomorrow").classList.toggle("active", day === "tomorrow");

            loadDashboard();

        }

        $("group-select").addEventListener("change", event => {

            clearCountdown();

            currentGroup = event.target.value;

            saveGroup();

            loadDashboard();

        });

        function mergeSlots(slots) {

            const sorted = slots

                .filter(s => isOutage(s) || isNotPlanned(s))

                .filter(validSlot)

                .map(s => ({

                    start: s.start,

                    end: s.end,

                    isOff: isOutage(s)

                }))

                .sort((a, b) => a.start - b.start);

            const result = [];

            for (const slot of sorted) {

                const last = result[result.length - 1];

                if (last && last.end === slot.start &&

                    last.isOff === slot.isOff) {

                    last.end = slot.end;

                } else {

                    result.push({ ...slot });

                }

            }

            return result;

        }

        function renderTimeline(slots, nowMinutes) {

            const bar = $("timeline-bar");

            bar.replaceChildren();

            const currentHour = currentDay === "today"

                ? Math.floor(nowMinutes / 60)

                : -1;

            for (let hour = 0; hour < 24; hour++) {

                const start = hour * 60;

                const end = start + 60;

                const segment = document.createElement("div");

                segment.className = "timeline-seg";

                if (hour === currentHour) {

                    segment.classList.add("current");

                }

                const matches = slots.filter(s =>

                    s.start < end && s.end > start

                );

                if (matches.some(isOutage)) {

                    segment.style.backgroundColor = "var(--outage)";

                } else if (

                    matches.length > 0 &&

                    matches.every(isNotPlanned)

                ) {

                    segment.style.backgroundColor = "var(--green)";

                } else {

                    segment.style.backgroundColor = "var(--yellow)";

                }

                bar.appendChild(segment);

            }

        }

        function renderIntervals(slots, nowMinutes) {

            const container = $("intervals-container");

            container.replaceChildren();

            let intervals = mergeSlots(slots);

            if (currentDay === "today") {

                intervals = intervals.filter(i => i.end > nowMinutes);

            }

            if (intervals.length === 0) {

                container.textContent = currentDay === "today"

                    ? "Подальших визначених періодів у графіку немає."

                    : "Визначених періодів у графіку немає.";

                return;

            }

            intervals.forEach(interval => {

                const row = document.createElement("div");

                row.className = "period-row";

                const time = document.createElement("div");

                time.className = "period-time";

                const dot = document.createElement("span");

                dot.className = "badge";

                dot.style.backgroundColor = interval.isOff

                    ? "var(--outage)"

                    : "var(--green)";

                time.append(dot);

                time.append(

                    document.createTextNode(

                        `${hhmm(interval.start)}–${hhmm(interval.end)}`

                    )

                );

                const label = document.createElement("span");

                label.className = "detail period-label";

                label.textContent = interval.isOff

                    ? "Відключення"

                    : "Світло є за графіком";

                const state = document.createElement("span");
                state.className = "detail";
                state.textContent = interval.isOff ? "Без світла" : "Є світло";
                row.append(time, state, label);

                container.appendChild(row);

            });

        }

        async function loadDashboard({ forceRefresh = false } = {}) {

            if (loading) return;

            loading = true;

            const refreshButton = $("refresh-button");

            refreshButton.disabled = true;

            if (forceRefresh) refreshButton.textContent = "Оновлюю дані…";

            try {

                const params = new URLSearchParams({
                    group: currentGroup,
                    day: currentDay,
                    refresh: forceRefresh ? "1" : "0"
                });

                const data = await apiGet(`/schedule?${params.toString()}`);

                if (data.error) {

                    setError(data.error);

                    return;

                }

                if (!Array.isArray(data.slots)) {

                    throw new Error("Сервер повернув графік у невідомому форматі.");

                }

                const slots = data.slots.filter(validSlot);

                const { hour, minute } = kyivParts();

                const nowMinutes = hour * 60 + minute;

                updateScheduleDate(data);

                updateDataState(data);

                const hasSchedule = data.status &&

                    ["WaitingForSchedule", "ScheduleApplies",

                     "NoShutdowns", "PlannedShutdowns"]

                        .includes(data.status);

                if (data.status === "EmergencyShutdowns") {

                    $("status-card").dataset.state = "unknown";

                    $("status-dot").style.backgroundColor = "var(--yellow)";

                    $("headline-text").textContent = "Аварійний режим";

                    $("detail-text").textContent =

                        "Звичайний графік може не відповідати фактичним відключенням.";

                } else if (currentDay === "today") {

                    const active = slots.find(s =>

                        isOutage(s) &&

                        nowMinutes >= s.start &&

                        nowMinutes < s.end

                    );

                    const next = slots

                        .filter(s => isOutage(s) && s.start > nowMinutes)

                        .sort((a, b) => a.start - b.start)[0];

                    if (active) {

                        $("status-card").dataset.state = "off";

                        $("status-dot").style.backgroundColor = "var(--outage)";

                        $("headline-text").textContent = "Відключення за графіком";

                        $("detail-text").textContent =

                            `За графіком до ${hhmm(active.end)}`;

                    } else if (hasSchedule) {

                        $("status-card").dataset.state = "on";

                        $("status-dot").style.backgroundColor = "var(--green)";

                        $("headline-text").textContent = "Світло має бути";

                        $("detail-text").textContent = next

                            ? `Наступне відключення за графіком о ${hhmm(next.start)}`

                            : "Подальших запланованих відключень немає";

                    } else {

                        $("status-dot").style.backgroundColor = "var(--yellow)";

                        $("status-card").dataset.state = "unknown";
                        $("headline-text").textContent = "Перевір статус графіка";

                        $("detail-text").textContent =

                            "YASNO не підтвердив застосування цього графіка.";

                    }

                } else {
                    const tomorrowHasOutage = slots.some(isOutage);
                    const tomorrowStatus = data.status === "NoShutdowns"
                        ? "on"
                        : tomorrowHasOutage ? "off" : "unknown";
                    $("status-card").dataset.state = tomorrowStatus;
                    $("status-dot").style.backgroundColor =
                        tomorrowStatus === "on" ? "var(--green)" :
                        tomorrowStatus === "off" ? "var(--outage)" : "var(--yellow)";

                    $("headline-text").textContent =
                        data.status === "NoShutdowns"
                            ? "Планових відключень немає"
                            : "Графік на завтра";

                    $("detail-text").textContent =
                        "Черга " + currentGroup + " · " + scheduleStatusLabel(data.status);

                }

                updateScheduleCountdown(slots, nowMinutes, data);

                renderTimeline(slots, nowMinutes);

                renderIntervals(slots, nowMinutes);

            } catch (error) {

                console.error("Помилка завантаження графіка:", error);

                setError(

                    "Не вдалося отримати графік. Перевірте підключення " +

                    "або спробуйте оновити дані пізніше."

                );

            } finally {

                loading = false;

                refreshButton.disabled = false;

                refreshButton.textContent = "↻ Оновити дані";

            }

        }

        async function init() {

            await fetchGroupsList();

            await loadDashboard();

            if (refreshTimer) clearInterval(refreshTimer);

            refreshTimer = setInterval(() => loadDashboard(), REFRESH_MS);

            if (!countdownTimer) {
                countdownTimer = setInterval(renderCountdown, 1000);
            }

        }

        init();

    </script>

</body>
