

<!DOCTYPE html>

<html lang="uk">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

    <meta name="theme-color" content="#17191D">

    <title>POWER / KYIV</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    
<style>
    :root {
        color-scheme: dark;
        --bg-color: #0b0d12;
        --panel-bg: rgba(28, 31, 39, .88);
        --text-color: #f5f6fa;
        --muted-color: #9da4b2;
        --line-color: rgba(255,255,255,.085);
        --green: #55d89a;
        --red: #ff6b72;
        --yellow: #f6c85f;
        --empty: #343945;
        --active-tab: #3b82f6;
        --accent: #5b9cff;
        --shadow: 0 12px 32px rgba(0,0,0,.18);
    }

    @media (prefers-color-scheme: light) {
        :root {
            color-scheme: light;
            --bg-color: #f2f4f8;
            --panel-bg: rgba(255,255,255,.9);
            --text-color: #171a22;
            --muted-color: #737b8b;
            --line-color: rgba(22,29,44,.09);
            --green: #159b63;
            --red: #e54855;
            --yellow: #d99a16;
            --empty: #e1e5ec;
            --active-tab: #fff;
            --accent: #1769e0;
            --shadow: 0 8px 24px rgba(24,39,75,.07);
        }
    }

    * { box-sizing: border-box; }

    html {
        min-height: 100%;
        background: var(--bg-color);
    }

    body {
        min-height: 100vh;
        font-family: -apple-system, BlinkMacSystemFont,
            "SF Pro Display", "Segoe UI", Roboto, sans-serif;
        background:
            radial-gradient(
                ellipse at 90% -10%,
                rgba(54,112,220,.15),
                transparent 42%
            ),
            var(--bg-color);
        color: var(--text-color);
        margin: 0;
        padding: max(20px, env(safe-area-inset-top))
                 16px
                 max(24px, env(safe-area-inset-bottom));
        user-select: none;
        -webkit-tap-highlight-color: transparent;
        letter-spacing: -.01em;
    }

    body > * {
        max-width: 620px;
        margin-left: auto;
        margin-right: auto;
    }

    .header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        margin-bottom: 20px;
        padding: 4px 2px;
    }

    .header h1 {
        margin: 0 0 5px;
        font-size: 18px;
        letter-spacing: -.045em;
        font-weight: 800;
    }

    .detail {
        font-size: 12px;
        color: var(--muted-color);
        line-height: 1.55;
    }

    .group-select {
        appearance: none;
        -webkit-appearance: none;
        background-color: var(--panel-bg);
        color: var(--text-color);
        border: 1px solid var(--line-color);
        border-radius: 14px;
        padding: 11px 30px 11px 13px;
        font-size: 13px;
        font-weight: 650;
        max-width: 155px;
        outline: none;
        box-shadow: var(--shadow);
        background-image:
            linear-gradient(45deg, transparent 50%, var(--muted-color) 50%),
            linear-gradient(135deg, var(--muted-color) 50%, transparent 50%);
        background-position:
            calc(100% - 15px) 16px,
            calc(100% - 10px) 16px;
        background-size: 5px 5px, 5px 5px;
        background-repeat: no-repeat;
    }

    .tabs {
        display: flex;
        background: rgba(128,136,151,.12);
        border-radius: 16px;
        padding: 4px;
        gap: 4px;
        margin-bottom: 14px;
        border: 1px solid var(--line-color);
    }

    .tab-btn {
        flex: 1;
        padding: 12px 8px;
        font-size: 14px;
        font-weight: 650;
        border-radius: 12px;
        border: 0;
        background: transparent;
        color: var(--muted-color);
        transition: background .2s, color .2s, transform .15s;
        cursor: pointer;
    }

    .tab-btn.active {
        background: var(--active-tab);
        color: var(--text-color);
        box-shadow: 0 2px 8px rgba(0,0,0,.08);
    }

    .card {
        background: var(--panel-bg);
        border: 1px solid var(--line-color);
        border-radius: 22px;
        padding: 19px;
        margin-bottom: 14px;
        box-shadow: var(--shadow);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
    }

    .headline {
        font-size: 19px;
        font-weight: 750;
        letter-spacing: -.035em;
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 7px;
    }

    .badge {
        display: inline-block;
        flex: 0 0 9px;
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: var(--yellow);
        box-shadow: 0 0 0 4px rgba(246,200,95,.15);
    }

    .headline .badge {
        width: 10px;
        height: 10px;
        flex-basis: 10px;
    }

    #detail-text { font-size: 13px; }

    .timeline {
        display: flex;
        gap: 3px;
        height: 10px;
        margin: 20px 0 9px;
    }

    .timeline-seg {
        flex: 1;
        min-width: 0;
        border-radius: 4px;
        background: var(--empty);
        transition: opacity .2s;
    }

    .timeline-seg.current {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
        z-index: 1;
    }

    .ticks {
        display: flex;
        justify-content: space-between;
        font-size: 10px;
        font-weight: 600;
        color: var(--muted-color);
        margin-bottom: 2px;
    }

    .period-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        padding: 13px 0;
        border-bottom: 1px solid var(--line-color);
        font-size: 13px;
    }

    .period-row:last-child {
        border-bottom: none;
        padding-bottom: 1px;
    }

    .period-time {
        font-weight: 700;
        display: flex;
        align-items: center;
        gap: 9px;
        white-space: nowrap;
        font-variant-numeric: tabular-nums;
    }

    .period-time .badge { box-shadow: none; }

    .period-row .detail {
        text-align: right;
        font-size: 11px;
    }

    .data-warning {
        padding: 12px 14px;
        margin: 0 0 14px;
        border: 1px solid rgba(246,200,95,.35);
        border-radius: 14px;
        background: rgba(246,200,95,.09);
        color: var(--yellow);
        font-size: 12px;
        line-height: 1.45;
    }

    .btn-refresh {
        display: block;
        width: 100%;
        padding: 15px;
        border-radius: 16px;
        border: 1px solid var(--line-color);
        background: var(--panel-bg);
        color: var(--text-color);
        font-size: 14px;
        font-weight: 700;
        margin-top: 6px;
        box-shadow: var(--shadow);
        cursor: pointer;
        transition: opacity .2s, transform .15s;
    }

    .btn-refresh:disabled { opacity: .55; }

    button, select { font-family: inherit; }

    button:active { transform: scale(.985); }

    button:focus-visible,
    select:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 3px;
    }

    @media (max-width: 360px) {
        body {
            padding-left: 12px;
            padding-right: 12px;
        }

        .card {
            padding: 16px;
            border-radius: 19px;
        }

        .headline { font-size: 17px; }

        .period-row { gap: 8px; }

        .period-time {
            gap: 6px;
            font-size: 12px;
        }

        .period-row .detail { font-size: 10px; }
    }

    @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
            transition-duration: .01ms !important;
        }
    }
</style>


</head>

<body>

    <div class="header">

        <div>

            <h1>POWER / KYIV</h1>

            <span id="update-label" class="detail">YASNO · Завантаження</span>

        </div>

        <select id="group-select" class="group-select"

                aria-label="Вибір черги">

            <option value="35.1">Черга 35.1</option>

        </select>

    </div>

    <div class="tabs">

        <button id="tab-today" class="tab-btn active"

                onclick="switchDay('today')">Сьогодні</button>

        <button id="tab-tomorrow" class="tab-btn"

                onclick="switchDay('tomorrow')">Завтра</button>

    </div>

    <div id="data-warning" class="data-warning" role="status"
         aria-live="polite" hidden></div>

    <div class="card">

        <div class="headline">

            <span id="status-dot" class="badge"></span>

            <span id="headline-text">Завантаження...</span>

        </div>

        <div id="schedule-date" class="detail"></div>

        <div id="detail-text" class="detail">Отримання графіка...</div>

        <div id="timeline-bar" class="timeline"></div>

        <div class="ticks">

            <span>00</span><span>06</span><span>12</span>

            <span>18</span><span>24</span>

        </div>

    </div>

    <div class="card">

        <div style="font-size:12px;font-weight:600;color:var(--muted-color);margin-bottom:8px">

            ПЕРІОДИ ВІДКЛЮЧЕНЬ

        </div>

        <div id="intervals-container" class="detail">

            Завантаження...

        </div>

    </div>

    <button id="refresh-button" class="btn-refresh"

            onclick="loadDashboard({ forceRefresh: true })">↻ Оновити дані</button>

    <script>

        const tg = window.Telegram?.WebApp;

        if (tg) {

            tg.ready();

            tg.expand();

        }

        const SERVER = "https://svitlo-bot-ysac.onrender.com";

        const REFRESH_MS = 60000;

        let currentDay = "today";

        let loading = false;

        let refreshTimer = null;

        const $ = id => document.getElementById(id);

        function readSavedGroup() {

            try {

                return localStorage.getItem("selected_group") || "35.1";

            } catch {

                return "35.1";

            }

        }

        let currentGroup = readSavedGroup();

        // Київський час незалежно від часового поясу пристрою.

        function kyivParts() {

            const parts = new Intl.DateTimeFormat("en-GB", {

                timeZone: "Europe/Kyiv",

                hour: "2-digit",

                minute: "2-digit",

                hourCycle: "h23"

            }).formatToParts(new Date());

            const get = type => Number(

                parts.find(p => p.type === type)?.value || 0

            );

            return { hour: get("hour"), minute: get("minute") };

        }

        function formatKyivTimestamp(value) {

            if (!value) return "час невідомий";

            const date = new Date(value);

            if (Number.isNaN(date.getTime())) return String(value);

            return new Intl.DateTimeFormat("uk-UA", {
                timeZone: "Europe/Kyiv",
                dateStyle: "short",
                timeStyle: "short"
            }).format(date);

        }

        function formatScheduleDate(value) {

            if (!value) return "Дата графіка не вказана";

            const dateOnly = String(value).match(/^(\d{4})-(\d{2})-(\d{2})$/);

            const date = dateOnly
                ? new Date(Date.UTC(
                    Number(dateOnly[1]),
                    Number(dateOnly[2]) - 1,
                    Number(dateOnly[3]),
                    12
                ))
                : new Date(value);

            if (Number.isNaN(date.getTime())) return String(value);

            return new Intl.DateTimeFormat("uk-UA", {
                timeZone: "Europe/Kyiv",
                day: "numeric",
                month: "long",
                year: "numeric"
            }).format(date);

        }

        function scheduleStatusLabel(status) {

            const labels = {
                ScheduleApplies: "Графік відключень діє",
                WaitingForSchedule: "Графік очікується",
                NoShutdowns: "Планових відключень немає",
                PlannedShutdowns: "Є планові відключення",
                EmergencyShutdowns: "Аварійні відключення"
            };

            return labels[status] || "Статус уточнюється";

        }

        function updateScheduleDate(data) {

            const dayLabel = currentDay === "today" ? "Сьогодні" : "Завтра";

            $("schedule-date").textContent =
                dayLabel + " · " + formatScheduleDate(data.date) +
                " · Черга " + currentGroup;

        }

        function updateDataState(data) {

            const fetchedAt = formatKyivTimestamp(data.dataFetchedAt);
            const sourceUpdatedAt = data.updatedOn
                ? formatKyivTimestamp(data.updatedOn)
                : null;

            $("update-label").textContent = data.dataFetchedAt
                ? "YASNO · дані отримано " + fetchedAt + " за Києвом"
                : "YASNO · час отримання невідомий";

            if (sourceUpdatedAt) {
                $("update-label").textContent +=
                    " · у YASNO оновлено " + sourceUpdatedAt;
            }

            const warning = $("data-warning");
            warning.hidden = !data.dataIsStale;
            warning.textContent = data.dataIsStale
                ? "Не вдалося оновити дані. Показано кеш від " +
                    fetchedAt + " за київським часом."
                : "";

        }

        function hhmm(minutes) {

            const h = Math.floor(minutes / 60);

            const m = minutes % 60;

            return `${String(h).padStart(2, "0")}:${String(m).padStart(2, "0")}`;

        }

        function normalizeType(slot) {

            return String(slot?.type || "")

                .toLowerCase()

                .replace(/[\s_-]/g, "");

        }

        function isOutage(slot) {

            return normalizeType(slot) === "definite";

        }

        function isNotPlanned(slot) {

            return normalizeType(slot) === "notplanned";

        }

        function validSlot(slot) {

            return Number.isFinite(slot?.start) &&

                Number.isFinite(slot?.end) &&

                slot.start >= 0 &&

                slot.end <= 1440 &&

                slot.end > slot.start;

        }

        function setError(message) {

            $("status-dot").style.backgroundColor = "var(--yellow)";
            $("headline-text").innerText = "Немає актуальних даних";
            $("schedule-date").textContent = "";
            $("detail-text").innerText = message;
            $("timeline-bar").replaceChildren();
            $("intervals-container").innerText = message;
            $("update-label").textContent = "YASNO · помилка оновлення";

            const warning = $("data-warning");
            warning.hidden = false;
            warning.textContent = message;

        }

        async function apiGet(path) {

            const response = await fetch(
                `${SERVER}${path}`,
                { cache: "no-store" }
            );

            const data = await response.json().catch(() => ({}));

            if (!response.ok) {
                throw new Error(data.error || "Помилка сервера: HTTP " + response.status);
            }

            return data;

        }

        async function fetchGroupsList() {

            try {

                const data = await apiGet("/groups");

                if (!Array.isArray(data.groups) || data.groups.length === 0) {

                    return;

                }

                const select = $("group-select");

                select.replaceChildren();

                data.groups.forEach(group => {

                    const option = document.createElement("option");

                    option.value = String(group);

                    option.textContent = `Черга ${group}`;

                    select.appendChild(option);

                });

                if (data.groups.map(String).includes(currentGroup)) {

                    select.value = currentGroup;

                } else {

                    currentGroup = String(data.groups[0]);

                    select.value = currentGroup;

                    saveGroup();

                }

            } catch (error) {

                console.error("Не вдалося завантажити черги:", error);

                // Якщо /groups недоступний, залишаємо поточний варіант.

            }

        }

        function saveGroup() {

            try {

                localStorage.setItem("selected_group", currentGroup);

            } catch {}

        }

        function switchDay(day) {

            currentDay = day;

            $("tab-today").classList.toggle("active", day === "today");

            $("tab-tomorrow").classList.toggle("active", day === "tomorrow");

            loadDashboard();

        }

        $("group-select").addEventListener("change", event => {

            currentGroup = event.target.value;

            saveGroup();

            loadDashboard();

        });

        function mergeSlots(slots) {

            const sorted = slots

                .filter(s => isOutage(s) || isNotPlanned(s))

                .filter(validSlot)

                .map(s => ({

                    start: s.start,

                    end: s.end,

                    isOff: isOutage(s)

                }))

                .sort((a, b) => a.start - b.start);

            const result = [];

            for (const slot of sorted) {

                const last = result[result.length - 1];

                if (last && last.end === slot.start &&

                    last.isOff === slot.isOff) {

                    last.end = slot.end;

                } else {

                    result.push({ ...slot });

                }

            }

            return result;

        }

        function renderTimeline(slots, nowMinutes) {

            const bar = $("timeline-bar");

            bar.replaceChildren();

            const currentHour = currentDay === "today"

                ? Math.floor(nowMinutes / 60)

                : -1;

            for (let hour = 0; hour < 24; hour++) {

                const start = hour * 60;

                const end = start + 60;

                const segment = document.createElement("div");

                segment.className = "timeline-seg";

                if (hour === currentHour) {

                    segment.classList.add("current");

                }

                const matches = slots.filter(s =>

                    s.start < end && s.end > start

                );

                if (matches.some(isOutage)) {

                    segment.style.backgroundColor = "var(--red)";

                } else if (

                    matches.length > 0 &&

                    matches.every(isNotPlanned)

                ) {

                    segment.style.backgroundColor = "var(--green)";

                } else {

                    segment.style.backgroundColor = "var(--yellow)";

                }

                bar.appendChild(segment);

            }

        }

        function renderIntervals(slots, nowMinutes) {

            const container = $("intervals-container");

            container.replaceChildren();

            let intervals = mergeSlots(slots);

            if (currentDay === "today") {

                intervals = intervals.filter(i => i.end > nowMinutes);

            }

            if (intervals.length === 0) {

                container.textContent = currentDay === "today"

                    ? "Подальших визначених періодів у графіку немає."

                    : "Визначених періодів у графіку немає.";

                return;

            }

            intervals.forEach(interval => {

                const row = document.createElement("div");

                row.className = "period-row";

                const time = document.createElement("div");

                time.className = "period-time";

                const dot = document.createElement("span");

                dot.className = "badge";

                dot.style.backgroundColor = interval.isOff

                    ? "var(--red)"

                    : "var(--green)";

                time.append(dot);

                time.append(

                    document.createTextNode(

                        `${hhmm(interval.start)}–${hhmm(interval.end)}`

                    )

                );

                const label = document.createElement("span");

                label.className = "detail";

                label.textContent = interval.isOff

                    ? "Відключення"

                    : "Світло є за графіком";

                row.append(time, label);

                container.appendChild(row);

            });

        }

        async function loadDashboard({ forceRefresh = false } = {}) {

            if (loading) return;

            loading = true;

            const refreshButton = $("refresh-button");

            refreshButton.disabled = true;

            if (forceRefresh) refreshButton.textContent = "Оновлюю дані…";

            try {

                const params = new URLSearchParams({
                    group: currentGroup,
                    day: currentDay,
                    refresh: forceRefresh ? "1" : "0"
                });

                const data = await apiGet(`/schedule?${params.toString()}`);

                if (data.error) {

                    setError(data.error);

                    return;

                }

                if (!Array.isArray(data.slots)) {

                    throw new Error("Сервер повернув графік у невідомому форматі.");

                }

                const slots = data.slots.filter(validSlot);

                const { hour, minute } = kyivParts();

                const nowMinutes = hour * 60 + minute;

                updateScheduleDate(data);

                updateDataState(data);

                const hasSchedule = data.status &&

                    ["WaitingForSchedule", "ScheduleApplies",

                     "NoShutdowns", "PlannedShutdowns"]

                        .includes(data.status);

                if (data.status === "EmergencyShutdowns") {

                    $("status-dot").style.backgroundColor = "var(--yellow)";

                    $("headline-text").textContent = "Аварійний режим";

                    $("detail-text").textContent =

                        "Звичайний графік може не відповідати фактичним відключенням.";

                } else if (currentDay === "today") {

                    const active = slots.find(s =>

                        isOutage(s) &&

                        nowMinutes >= s.start &&

                        nowMinutes < s.end

                    );

                    const next = slots

                        .filter(s => isOutage(s) && s.start > nowMinutes)

                        .sort((a, b) => a.start - b.start)[0];

                    if (active) {

                        $("status-dot").style.backgroundColor = "var(--red)";

                        $("headline-text").textContent = "Відключення за графіком";

                        $("detail-text").textContent =

                            `За графіком до ${hhmm(active.end)}`;

                    } else if (hasSchedule) {

                        $("status-dot").style.backgroundColor = "var(--green)";

                        $("headline-text").textContent = "Світло має бути";

                        $("detail-text").textContent = next

                            ? `Наступне відключення за графіком о ${hhmm(next.start)}`

                            : "Подальших запланованих відключень немає";

                    } else {

                        $("status-dot").style.backgroundColor = "var(--yellow)";

                        $("headline-text").textContent = "Перевір статус графіка";

                        $("detail-text").textContent =

                            "YASNO не підтвердив застосування цього графіка.";

                    }

                } else {

                    $("status-dot").style.backgroundColor =
                        data.status === "NoShutdowns" ? "var(--green)" : "var(--yellow)";

                    $("headline-text").textContent =
                        data.status === "NoShutdowns"
                            ? "Планових відключень немає"
                            : "Графік на завтра";

                    $("detail-text").textContent =
                        "Черга " + currentGroup + " · " + scheduleStatusLabel(data.status);

                }

                renderTimeline(slots, nowMinutes);

                renderIntervals(slots, nowMinutes);

                if (data.updatedOn) {

                    $("update-label").textContent =

                        `YASNO · Оновлено ${data.updatedOn}`;

                }

            } catch (error) {

                console.error("Помилка завантаження графіка:", error);

                setError(

                    "Не вдалося отримати графік. Перевірте підключення " +

                    "або спробуйте оновити дані пізніше."

                );

            } finally {

                loading = false;

                refreshButton.disabled = false;

                refreshButton.textContent = "↻ Оновити дані";

            }

        }

        async function init() {

            await fetchGroupsList();

            await loadDashboard();

            if (refreshTimer) clearInterval(refreshTimer);

            refreshTimer = setInterval(() => loadDashboard(), REFRESH_MS);

        }

        init();

    </script>

</body>

</html>
