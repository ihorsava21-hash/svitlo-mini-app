<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Світло Дім</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: var(--tg-theme-bg-color, #1c1c1e);
            --text-color: var(--tg-theme-text-color, #ffffff);
            --card-bg: var(--tg-theme-secondary-bg-color, #2c2c2e);
            --hint-color: var(--tg-theme-hint-color, #8e8e93);
            --accent-color: var(--tg-theme-button-color, #007aff);
            --green: #32d74b;
            --red: #ff453a;
            --orange: #ff9f0a;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 16px;
            box-sizing: border-box;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .header h1 {
            margin: 0;
            font-size: 24px;
        }
        .header span {
            font-size: 13px;
            color: var(--hint-color);
        }
        .card {
            background-color: var(--card-bg);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 16px;
        }
        .ecoflow-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }
        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 14px;
        }
        .status-on {
            background-color: rgba(50, 215, 75, 0.15);
            color: var(--green);
        }
        .status-off {
            background-color: rgba(255, 69, 58, 0.15);
            color: var(--red);
        }
        .battery-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-weight: 600;
        }
        .battery-bar {
            height: 12px;
            background-color: rgba(142, 142, 147, 0.2);
            border-radius: 10px;
            overflow: hidden;
        }
        .battery-fill {
            height: 100%;
            border-radius: 10px;
            transition: width 0.5s ease-in-out;
        }
        .schedule-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 12px;
            color: var(--hint-color);
        }
        .period {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid rgba(142, 142, 147, 0.2);
        }
        .period:last-child {
            border-bottom: none;
            padding-bottom: 0;
        }
        .period-time {
            font-size: 18px;
            font-weight: 600;
        }
        .period-status {
            font-size: 14px;
            font-weight: 500;
        }
        .text-green { color: var(--green); }
        .text-red { color: var(--red); }
        .text-orange { color: var(--orange); }
        .btn-refresh {
            display: block;
            width: 100%;
            padding: 14px;
            background-color: var(--accent-color);
            color: white;
            border-radius: 12px;
            border: none;
            font-size: 16px;
            font-weight: 600;
            margin-top: 24px;
            cursor: pointer;
        }
    </style>
</head>

        <h1>🏠 Дім</h1>
        <span id="time-updated">Оновлення...</span>
    </div>
