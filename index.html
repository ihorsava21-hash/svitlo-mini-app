<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>POWER / KYIV</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #17191D;
            --panel-bg: #22252B;
            --text-color: #F2F3F5;
            --muted-color: #9298A3;
            --line-color: #373B43;
            --green: #83C99A;
            --red: #E68C88;
            --yellow: #E4C77E;
            --empty: #41454E;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 16px;
            box-sizing: border-box;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }
        .header h1 {
            margin: 0;
            font-size: 16px;
            letter-spacing: 0.5px;
            font-weight: 700;
        }
        .header span {
            font-size: 12px;
            color: var(--muted-color);
        }
        .card {
            background-color: var(--panel-bg);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 12px;
        }
        .headline {
            font-size: 18px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 4px;
        }
        .detail {
            font-size: 13px;
            color: var(--muted-color);
        }
        .badge {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
        }
        .timeline {
            display: flex;
            gap: 2px;
            height: 8px;
            margin: 16px 0 8px 0;
        }
        .timeline-seg {
            flex: 1;
            border-radius: 2px;
            background-color: var(--empty);
        }
        .timeline-seg.current {
            outline: 1px solid var(--text-color);
        }
        .ticks {
            display: flex;
            justify-content: space-between;
            font-size: 10px;
            color: var(--muted-color);
            margin-bottom: 16px;
        }
        .period-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px solid var(--line-color);
            font-size: 14px;
        }
        .period-row:last-child {
            border-bottom: none;
        }
        .period-time {
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .btn-refresh {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            border: none;
            background-color: var(--panel-bg);
            color: var(--text-color);
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
            border: 1px solid var(--line-color);
        }
    </style>
</head>
<body>
    <div class="header">
        <div>
            <h1>POWER / KYIV</h1>
            <span style="font-size: 11px;">ЧЕРГА 35.1</span>
        </div>
        <span id="update-label">Оновлення...</span>
    </div>

    <div class="card">
        <div class="headline">
            <span id="status-dot" class="badge"></span>
            <span id="headline-text">Завантаження...</span>
        </div>
        <div id="detail-text" class="detail">З'єднання з сервером YASNO...</div>
        
        <div id="timeline-bar" class="timeline"></div>
        <div class="ticks">
            <span>00</span><span>06</span><span>12</span><span>18</span><span>24</span>
        </div>
    </div>

    <div class="card">
        <div style="font-size: 12px; font-weight: 600; color: var(--muted-color); margin-bottom: 8px;">НАЙБЛИЖЧІ ПЕРІОДИ</div>
        <div id="intervals-container">Завантаження...</div>
    </div>

    <button class="btn-refresh" onclick="loadDashboard()">↻ Оновити дані</button>

    <script>
        window.Telegram.WebApp.ready();
        window.Telegram.WebApp.expand();

        const API = "https://app.yasno.ua/api/blackout-service/public/shutdowns/regions/25/dsos/902/planned-outages";
        const QUEUE = "35.1";

        function hhmm(m) {
            const h = Math.floor(m / 60);
            const min = m % 60;
            return `${String(h).padStart(2, "0")}:${String(min).padStart(2, "0")}`;
        }

        async function loadDashboard() {
            try {
                const res = await fetch(API);
                const data = await res.json();
                const group = data[QUEUE];

                if (!group || !group.today || !Array.isArray(group.today.slots)) {
                    throw new Error("Не знайдено розклад черги");
                }

                const slots = group.today.slots;
                const status = group.today.status;
                const now = new Date();
                const nowM = now.getHours() * 60 + now.getMinutes();

                document.getElementById('update-label').innerText = `YASNO · ${now.toLocaleTimeString('uk-UA', {hour: '2-digit', minute:'2-digit'})}`;

                const dot = document.getElementById('status-dot');
                const head = document.getElementById('headline-text');
                const detail = document.getElementById('detail-text');

                if (status !== "ScheduleApplies") {
                    dot.style.backgroundColor = "var(--yellow)";
                    head.innerText = "Графік очікується";
                    detail.innerText = "YASNO ще не підтвердив розклад";
                } else {
                    const active = slots.find(s => s.type === "definite" && nowM >= s.start && nowM < s.end);
                    const next = slots.find(s => s.type === "definite" && s.start > nowM);

                    if (active) {
                        dot.style.backgroundColor = "var(--red)";
                        head.innerText = "Світла немає";
                        detail.innerText = `За графіком до ${hhmm(active.end)}`;
                    } else {
                        dot.style.backgroundColor = "var(--green)";
                        head.innerText = "Світло є";
                        detail.innerText = next ? `Відключення о ${hhmm(next.start)}` : "Відключень далі немає";
                    }
                }

                // Шкала 24 години
                const bar = document.getElementById('timeline-bar');
                bar.innerHTML = '';
                const curHour = now.getHours();

                for (let h = 0; h < 24; h++) {
                    const seg = document.createElement('div');
                    seg.className = `timeline-seg ${h === curHour ? 'current' : ''}`;
                    const a = h * 60;
                    const b = a + 60;

                    const match = slots.filter(s => s.start < b && s.end > a);
                    if (status === "ScheduleApplies") {
                        if (match.some(s => s.type === "definite")) {
                            seg.style.backgroundColor = "var(--red)";
                        } else if (match.some(s => s.type === "notplanned")) {
                            seg.style.backgroundColor = "var(--green)";
                        } else {
                            seg.style.backgroundColor = "var(--yellow)";
                        }
                    }
                    bar.appendChild(seg);
                }

                // Інтервали
                const sorted = [...slots]
                    .filter(s => s.type === "definite" || s.type === "notplanned")
                    .sort((a, b) => a.start - b.start);

                const intervals = [];
                for (const s of sorted) {
                    const last = intervals[intervals.length - 1];
                    if (last && last.end === s.start && last.type === s.type) {
                        last.end = s.end;
                    } else {
                        intervals.push({ start: s.start, end: s.end, type: s.type });
                    }
                }

                const visible = intervals.filter(i => i.end > nowM).slice(0, 3);
                const container = document.getElementById('intervals-container');
                container.innerHTML = '';

                if (visible.length === 0) {
                    container.innerHTML = '<span class="detail">Більше немає інтервалів на сьогодні</span>';
                } else {
                    visible.forEach(i => {
                        const isOff = i.type === "definite";
                        const row = document.createElement('div');
                        row.className = 'period-row';
                        row.innerHTML = `
                            <div class="period-time">
                                <span class="badge" style="background-color: ${isOff ? 'var(--red)' : 'var(--green)'}"></span>
                                ${hhmm(i.start)}–${hhmm(i.end)}
                            </div>
                            <span class="detail">${isOff ? 'Світла немає' : 'Світло є за графіком'}</span>
                        `;
                        container.appendChild(row);
                    });
                }
            } catch (err) {
                document.getElementById('headline-text').innerText = "Помилка";
                document.getElementById('detail-text').innerText = err.message;
            }
        }

        loadDashboard();
    </script>
</body>
</html>
