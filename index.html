<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>POWER / KYIV</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #17191D;
            --panel-bg: #22252B;
            --text-color: #F2F3F5;
            --muted-color: #9298A3;
            --line-color: #373B43;
            --green: #83C99A;
            --red: #E68C88;
            --yellow: #E4C77E;
            --empty: #41454E;
            --active-tab: #2F333D;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 16px;
            box-sizing: border-box;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        .header h1 {
            margin: 0;
            font-size: 16px;
            letter-spacing: 0.5px;
            font-weight: 700;
        }
        .group-select {
            background-color: var(--panel-bg);
            color: var(--text-color);
            border: 1px solid var(--line-color);
            border-radius: 8px;
            padding: 6px 10px;
            font-size: 13px;
            font-weight: 600;
            outline: none;
        }
        .tabs {
            display: flex;
            background-color: var(--panel-bg);
            border-radius: 10px;
            padding: 4px;
            gap: 4px;
            margin-bottom: 12px;
            border: 1px solid var(--line-color);
        }
        .tab-btn {
            flex: 1;
            padding: 8px;
            text-align: center;
            font-size: 13px;
            font-weight: 600;
            border-radius: 8px;
            border: none;
            background: transparent;
            color: var(--muted-color);
            cursor: pointer;
            transition: 0.2s;
        }
        .tab-btn.active {
            background-color: var(--active-tab);
            color: var(--text-color);
        }
        .card {
            background-color: var(--panel-bg);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 12px;
        }
        .headline {
            font-size: 18px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 4px;
        }
        .detail {
            font-size: 13px;
            color: var(--muted-color);
        }
        .badge {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
        }
        .timeline {
            display: flex;
            gap: 2px;
            height: 8px;
            margin: 16px 0 8px 0;
        }
        .timeline-seg {
            flex: 1;
            border-radius: 2px;
            background-color: var(--empty);
        }
        .timeline-seg.current {
            outline: 1px solid var(--text-color);
        }
        .ticks {
            display: flex;
            justify-content: space-between;
            font-size: 10px;
            color: var(--muted-color);
            margin-bottom: 16px;
        }
        .period-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
