<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>POWER / KYIV</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #17191D;
            --panel-bg: #22252B;
            --text-color: #F2F3F5;
            --muted-color: #9298A3;
            --line-color: #373B43;
            --green: #83C99A;
            --red: #E68C88;
            --yellow: #E4C77E;
            --empty: #41454E;
            --active-tab: #2F333D;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 16px;
            box-sizing: border-box;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        .header h1 {
            margin: 0;
            font-size: 16px;
            letter-spacing: 0.5px;
            font-weight: 700;
        }
        .group-select {
            background-color: var(--panel-bg);
            color: var(--text-color);
            border: 1px solid var(--line-color);
            border-radius: 8px;
            padding: 4px 8px;
            font-size: 12px;
            font-weight: 600;
            outline: none;
        }
        /* Вкладки Сьогодні / Завтра */
        .tabs {
            display: flex;
            background-color: var(--panel-bg);
            border-radius: 10px;
            padding: 4px;
            gap: 4px;
            margin-bottom: 12px;
            border: 1px solid var(--line-color);
        }
        .tab-btn {
            flex: 1;
            padding: 8px;
            text-align: center;
            font-size: 13px;
            font-weight: 600;
            border-radius: 8px;
            border: none;
            background: transparent;
            color: var(--muted-color);
            cursor: pointer;
        }
        .tab-btn.active {
            background-color: var(--active-tab);
            color: var(--text-color);
        }
        .card {
            background-color: var(--panel-bg);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 12px;
        }
        .headline {
            font-size: 18px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 4px;
        }
        .detail {
            font-size: 13px;
            color: var(--muted-color);
        }
        .badge {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
        }
        .timeline {
            display: flex;
            gap: 2px;
            height: 8px;
            margin: 16px 0 8px 0;
        }
        .timeline-seg {
            flex: 1;
            border-radius: 2px;
            background-color: var(--empty);
        }
        .timeline-seg.current {
            outline: 1px solid var(--text-color);
        }
        .ticks {
            display: flex;
            justify-content: space-between;
            font-size: 10px;
            color: var(--muted-color);
            margin-bottom: 16px;
        }
        .period-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px solid var(--line-color);
            font-size: 14px;
        }
        .period-row:last-child {
            border-bottom: none;
        }
        .period-time {
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .btn-refresh {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            border: none;
            background-color: var(--panel-bg);
            color: var(--text-color);
            font-weight: 600;
            cursor: pointer;
            margin-top: 6px;
            border: 1px solid var(--line-color);
        }
    </style>
</head>
<body>
    <div class="header">
        <div>
            <h1>POWER / KYIV</h1>
            <span id="update-label" style="font-size: 11px; color: var(--muted-color);">YASNO</span>
        </div>
        <div>
            <label style="font-size: 11px; color: var(--muted-color); margin-right: 4px;">ЧЕРГА</label>
            <select id="group-select" class="group-select" onchange="onGroupChange()">
                <option value="35.1">35.1</option>
                <option value="1.1">1.1</option>
                <option value="1.2">1.2</option>
                <option value="2.1">2.1</option>
                <option value="2.2">2.2</option>
                <option value="3.1">3.1</option>
                <option value="3.2">3.2</option>
                <option value="4.1">4.1</option>
                <option value="4.2">4.2</option>
                <option value="5.1">5.1</option>
                <option value="5.2">5.2</option>
                <option value="6.1">6.1</option>
                <option value="6.2">6.2</option>
            </select>
        </div>
    </div>

    <!-- Перемикач днів -->
    <div class="tabs">
        <button id="tab-today" class="tab-btn active" onclick="switchDay('today')">Сьогодні</button>
        <button id="tab-tomorrow" class="tab-btn" onclick="switchDay('tomorrow')">Завтра</button>
    </div>

    <div class="card">
        <div class="headline">
            <span id="status-dot" class="badge"></span>
            <span id="headline-text">Завантаження...</span>
        </div>
        <div id="detail-text" class="detail">З'єднання з сервером...</div>
        
        <div id="timeline-bar" class="timeline"></div>
        <div class="ticks">
            <span>00</span><span>06</span><span>12</span><span>18</span><span>24</span>
        </div>
    </div>

    <div class="card">
        <div style="font-size: 12px; font-weight: 600; color: var(--muted-color); margin-bottom: 8px;">ПЕРІОДИ ВІДКЛЮЧЕНЬ</div>
        <div id="intervals-container">Завантаження...</div>
    </div>

    <button class="btn-refresh" onclick="loadDashboard()">↻ Оновити дані</button>

    <script>
        window.Telegram.WebApp.ready();
        window.Telegram.WebApp.expand();

        let currentDay = "today";
        let currentGroup = localStorage.getItem("selected_group") || "35.1";
        document.getElementById('group-select').value = currentGroup;

        function switchDay(day) {
            currentDay = day;
            document.getElementById('tab-today').className = `tab-btn ${day === 'today' ? 'active' : ''}`;
            document.getElementById('tab-tomorrow').className = `tab-btn ${day === 'tomorrow' ? 'active' : ''}`;
            loadDashboard();
        }

        function onGroupChange() {
            currentGroup = document.getElementById('group-select').value;
            localStorage.setItem("selected_group", currentGroup);
            loadDashboard();
        }

        function hhmm(m) {
            const h = Math.floor(m / 60);
            const min = m % 60;
            return `${String(h).padStart(2, "0")}:${String(min).padStart(2, "0")}`;
        }

        function typeOf(slot) {
            return String(slot.type || "").toLowerCase().replace(/_/g, "");
        }

        function isOutage(slot) {
            const t = typeOf(slot);
            return t === "definite" || t === "definiteoutage";
        }

        function isNotPlanned(slot) {
            return typeOf(slot) === "notplanned";
        }

        async function loadDashboard() {
            try {
                const api = `https://svitlo-bot-ysac.onrender.com/schedule?group=${currentGroup}&day=${currentDay}`;
                const res = await fetch(api);
                const data = await res.json();

                const dot = document.getElementById('status-dot');
                const head = document.getElementById('headline-text');
                const detail = document.getElementById('detail-text');
                const bar = document.getElementById('timeline-bar');
                const container = document.getElementById('intervals-container');

                if (data.error) {
                    dot.style.backgroundColor = "var(--yellow)";
                    head.innerText = currentDay === 'tomorrow' ? "Графік на завтра очікується" : "Графік очікується";
                    detail.innerText = data.error;
                    bar.innerHTML = '';
                    container.innerHTML = '<span class="detail">Розклад ще не сформований YASNO</span>';
                    return;
                }

                const slots = data.slots || [];
                const now = new Date();
                const nowM = currentDay === 'today' ? (now.getHours() * 60 + now.getMinutes()) : -1;

                document.getElementById('update-label').innerText = `YASNO · ${now.toLocaleTimeString('uk-UA', {hour: '2-digit', minute:'2-digit'})}`;

                if (currentDay === 'today') {
                    const active = slots.find(s => isOutage(s) && nowM >= s.start && nowM < s.end);
                    const next = slots.find(s => isOutage(s) && s.start > nowM);

                    if (active) {
                        dot.style.backgroundColor = "var(--red)";
                        head.innerText = "Світла немає";
                        detail.innerText = `За графіком до ${hhmm(active.end)}`;
                    } else {
                        dot.style.backgroundColor = "var(--green)";
                        head.innerText = "Світло є";
                        detail.innerText = next ? `Відключення о ${hhmm(next.start)}` : "Відключень далі немає";
                    }
                } else {
                    dot.style.backgroundColor = "var(--green)";
                    head.innerText = "Графік на завтра";
                    detail.innerText = `Черга ${currentGroup}`;
                }

                // 24-годинна шкала
                bar.innerHTML = '';
                const curHour = currentDay === 'today' ? now.getHours() : -1;

                for (let h = 0; h < 24; h++) {
                    const seg = document.createElement('div');
                    seg.className = `timeline-seg ${h === curHour ? 'current' : ''}`;
                    const a = h * 60;
                    const b = a + 60;

                    const match = slots.filter(s => s.start < b && s.end > a);
                    if (match.some(isOutage)) {
                        seg.style.backgroundColor = "var(--red)";
                    } else if (match.some(isNotPlanned)) {
                        seg.style.backgroundColor = "var(--green)";
                    } else {
                        seg.style.backgroundColor = "var(--yellow)";
                    }
                    bar.appendChild(seg);
                }

                // Інтервали
                const sorted = [...slots]
                    .filter(s => isOutage(s) || isNotPlanned(s))
                    .sort((a, b) => a.start - b.start);

                const intervals = [];
                for (const s of sorted) {
                    const off = isOutage(s);
                    const last = intervals[intervals.length - 1];
                    if (last && last.end === s.start && last.isOff === off) {
                        last.end = s.end;
                    } else {
                        intervals.push({ start: s.start, end: s.end, isOff: off });
                    }
                }

                const visible = currentDay === 'today' ? intervals.filter(i => i.end > nowM) : intervals;
                container.innerHTML = '';

                if (visible.length === 0) {
                    container.innerHTML = '<span class="detail">Відключень за графіком немає</span>';
                } else {
                    visible.forEach(i => {
                        const row = document.createElement('div');
                        row.className = 'period-row';
                        row.innerHTML = `
                            <div class="period-time">
                                <span class="badge" style="background-color: ${i.isOff ? 'var(--red)' : 'var(--green)'}"></span>
                                ${hhmm(i.start)}–${hhmm(i.end)}
                            </div>
                            <span class="detail">${i.isOff ? 'Світла немає' : 'Світло є за графіком'}</span>
                        `;
                        container.appendChild(row);
                    });
                }
            } catch (err) {
                document.getElementById('headline-text').innerText = "Помилка";
                document.getElementById('detail-text').innerText = err.message;
            }
        }

        loadDashboard();
    </script>
</body>
</html>
