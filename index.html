<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>POWER / KYIV</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #17191D;
            --panel-bg: #22252B;
            --text-color: #F2F3F5;
            --muted-color: #9298A3;
            --line-color: #373B43;
            --green: #83C99A;
            --red: #E68C88;
            --yellow: #E4C77E;
            --empty: #41454E;
            --active-tab: #2F333D;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 16px;
            box-sizing: border-box;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        .header h1 {
            margin: 0;
            font-size: 16px;
            letter-spacing: 0.5px;
            font-weight: 700;
        }
        .group-select {
            background-color: var(--panel-bg);
            color: var(--text-color);
            border: 1px solid var(--line-color);
            border-radius: 8px;
            padding: 6px 10px;
            font-size: 13px;
            font-weight: 600;
            outline: none;
        }
        .tabs {
            display: flex;
            background-color: var(--panel-bg);
            border-radius: 10px;
            padding: 4px;
            gap: 4px;
            margin-bottom: 12px;
            border: 1px solid var(--line-color);
        }
        .tab-btn {
            flex: 1;
            padding: 8px;
            text-align: center;
            font-size: 13px;
            font-weight: 600;
            border-radius: 8px;
            border: none;
            background: transparent;
            color: var(--muted-color);
            cursor: pointer;
        }
        .tab-btn.active {
            background-color: var(--active-tab);
            color: var(--text-color);
        }
        .card {
            background-color: var(--panel-bg);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 12px;
        }
        .headline {
            font-size: 18px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 4px;
        }
        .detail {
            font-size: 13px;
            color: var(--muted-color);
        }
        .badge {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: var(--yellow);
        }
        .timeline {
            display: flex;
            gap: 2px;
            height: 8px;
            margin: 16px 0 8px 0;
        }
        .timeline-seg {
            flex: 1;
            border-radius: 2px;
            background-color: var(--empty);
        }
        .timeline-seg.current {
            outline: 1px solid var(--text-color);
        }
        .ticks {
            display: flex;
            justify-content: space-between;
            font-size: 10px;
            color: var(--muted-color);
            margin-bottom: 16px;
        }
        .period-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px solid var(--line-color);
            font-size: 14px;
        }
        .period-row:last-child {
            border-bottom: none;
        }
        .period-time {
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .btn-refresh {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            border: none;
            background-color: var(--panel-bg);
            color: var(--text-color);
            font-weight: 600;
            cursor: pointer;
            margin-top: 6px;
            border: 1px solid var(--line-color);
        }
    </style>
</head>
<body>
    <div class="header">
        <div>
            <h1>POWER / KYIV</h1>
            <span id="update-label" style="font-size: 11px; color: var(--muted-color);">YASNO</span>
        </div>
        <div>
            <select id="group-select" class="group-select" onchange="onGroupChange()">
                <option value="35.1">Черга 35.1</option>
                <option value="1.1">Черга 1.1</option>
                <option value="1.2">Черга 1.2</option>
                <option value="2.1">Черга 2.1</option>
                <option value="2.2">Черга 2.2</option>
                <option value="3.1">Черга 3.1</option>
                <option value="3.2">Черга 3.2</option>
                <option value="4.1">Черга 4.1</option>
                <option value="4.2">Черга 4.2</option>
                <option value="5.1">Черга 5.1</option>
                <option value="5.2">Черга 5.2</option>
                <option value="6.1">Черга 6.1</option>
                <option value="6.2">Черга 6.2</option>
            </select>
        </div>
    </div>

    <!-- Вкладки Сьогодні / Завтра -->
    <div class="tabs">
        <button id="tab-today" class="tab-btn active" onclick="switchDay('today')">Сьогодні</button>
        <button id="tab-tomorrow" class="tab-btn" onclick="switchDay('tomorrow')">Завтра</button>
    </div>

    <div class="card">
        <div class="headline">
            <span id="status-dot" class="badge"></span>
            <span id="headline-text">Отримання даних...</span>
        </div>
        <div id="detail-text" class="detail">З'єднуємось із сервером...</div>
        
        <div id="timeline-bar" class="timeline"></div>
        <div class="ticks">
            <span>00</span><span>06</span><span>12</span><span>18</span><span>24</span>
        </div>
    </div>

    <div class="card">
        <div style="font-size: 12px; font-weight: 600; color: var(--muted-color); margin-bottom: 8px;">ПЕРІОДИ ВІДКЛЮЧЕНЬ</div>
        <div id="intervals-container">Завантаження розкладу...</div>
    </div>

    <button class="btn-refresh" onclick="loadDashboard()">↻ Оновити дані</button>

    <script>
        try {
            if (window.Telegram && window.Telegram.WebApp) {
                window.Telegram.WebApp.ready();
                window.Telegram.WebApp.expand();
            }
        } catch (e) {
            console.log(e);
        }

        const BACKEND_URL = "https://svitlo-bot-ysac.onrender.com";
        let currentDay = "today";
        let currentGroup = localStorage.getItem("selected_group") || "35.1";

        const select = document.getElementById('group-select');
        if (select) {
            select.value = currentGroup;
        }

        function switchDay(day) {
            currentDay = day;
            document.getElementById('tab-today').className = `tab-btn ${day === 'today' ? 'active' : ''}`;
            document.getElementById('tab-tomorrow').className = `tab-btn ${day === 'tomorrow' ? 'active' : ''}`;
            loadDashboard();
        }

        function onGroupChange() {
            currentGroup = document.getElementById('group-select').value;
            localStorage.setItem("selected_group", currentGroup);
            loadDashboard();
        }

        function hhmm(m) {
            const h = Math.floor(m / 60);
            const min = m % 60;
            return `${String(h).padStart(2, "0")}:${String(min).padStart(2, "0")}`;
        }

        function typeOf(slot) {
            return String(slot.type || "").toLowerCase().replace(/_/g, "");
        }

        function isOutage(slot) {
            const t = typeOf(slot);
            return t === "definite" || t === "definiteoutage";
        }

        function isNotPlanned(slot) {
            return typeOf(slot) === "notplanned";
        }

        async function fetchAvailableGroups() {
            try {
                const res = await fetch(`${BACKEND_URL}/groups`);
                if (!res.ok) return;
                const data = await res.json();
                if (data && data.groups && data.groups.length > 0) {
                    const sorted = data.groups.sort((a, b) => {
                        const pa = a.split('.').map(Number);
                        const pb = b.split('.').map(Number);
                        return (pa[0] * 100 + (pa[1] || 0)) - (pb[0] * 100 + (pb[1] || 0));
                    });
                    select.innerHTML = '';
                    sorted.forEach(g => {
                        const opt = document.createElement('option');
                        opt.value = g;
                        opt.innerText = `Черга ${g}`;
                        if (g === currentGroup) opt.selected = true;
                        select.appendChild(opt);
                    });
                }
            } catch (err) {
                console.log("Groups fetch fallback");
            }
        }

        async function loadDashboard() {
            const dot = document.getElementById('status-dot');
            const head = document.getElementById('headline-text');
            const detail = document.getElementById('detail-text');
            const bar = document.getElementById('timeline-bar');
            const container = document.getElementById('intervals-container');

            try {
                const api = `${BACKEND_URL}/schedule?group=${currentGroup}&day=${currentDay}`;
                const res = await fetch(api);
                const data = await res.json();

                if (data.error) {
                    dot.style.backgroundColor = "var(--yellow)";
                    head.innerText = currentDay === 'tomorrow' ? "Графік на завтра очікується" : "Графік очікується";
                    detail.innerText = data.error;
                    bar.innerHTML = '';
                    container.innerHTML = '<span class="detail">Розклад ще не опублікований YASNO</span>';
                    return;
                }

                const slots = data.slots || [];
                const now = new Date();
                const nowM = currentDay === 'today' ? (now.getHours() * 60 + now.getMinutes()) : -1;

                document.getElementById('update-label').innerText = `YASNO · ${now.toLocaleTimeString('uk-UA', {hour: '2-digit', minute:'2-digit'})}`;

                if (currentDay === 'today') {
                    const active = slots.find(s => isOutage(s) && nowM >= s.start && nowM < s.end);
                    const next = slots.find(s => isOutage(s) && s.start > nowM);

                    if (active) {
                        dot.style.backgroundColor = "var(--red)";
                        head.innerText = "Світла немає";
                        detail.innerText = `За графіком до ${hhmm(active.end)}`;
                    } else {
                        dot.style.backgroundColor = "var(--green)";
                        head.innerText = "Світ
