

<!DOCTYPE html>

<html lang="uk">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

    <meta name="theme-color" content="#17191D">

    <title>POWER / KYIV</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>

        :root {

            --bg-color: #17191D;

            --panel-bg: #22252B;

            --text-color: #F2F3F5;

            --muted-color: #9298A3;

            --line-color: #373B43;

            --green: #83C99A;

            --red: #E68C88;

            --yellow: #E4C77E;

            --empty: #41454E;

            --active-tab: #2F333D;

        }

        * { box-sizing: border-box; }

        body {

            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",

                Roboto, sans-serif;

            background: var(--bg-color);

            color: var(--text-color);

            margin: 0;

            padding: 16px;

            user-select: none;

        }

        .header {

            display: flex;

            justify-content: space-between;

            align-items: center;

            gap: 12px;

            margin-bottom: 12px;

        }

        .header h1 {

            margin: 0;

            font-size: 16px;

            letter-spacing: .5px;

            font-weight: 700;

        }

        .group-select {

            background: var(--panel-bg);

            color: var(--text-color);

            border: 1px solid var(--line-color);

            border-radius: 8px;

            padding: 8px;

            font-size: 13px;

            max-width: 145px;

        }

        .tabs {

            display: flex;

            background: var(--panel-bg);

            border-radius: 10px;

            padding: 4px;

            gap: 4px;

            margin-bottom: 12px;

            border: 1px solid var(--line-color);

        }

        .tab-btn {

            flex: 1;

            padding: 10px 8px;

            font-size: 13px;

            font-weight: 600;

            border-radius: 8px;

            border: none;

            background: transparent;

            color: var(--muted-color);

        }

        .tab-btn.active {

            background: var(--active-tab);

            color: var(--text-color);

        }

        .card {

            background: var(--panel-bg);

            border-radius: 12px;

            padding: 16px;

            margin-bottom: 12px;

        }

        .headline {

            font-size: 18px;

            font-weight: 700;

            display: flex;

            align-items: center;

            gap: 8px;

            margin-bottom: 4px;

        }

        .detail {

            font-size: 13px;

            color: var(--muted-color);

            line-height: 1.5;

        }

        .badge {

            display: inline-block;

            flex: 0 0 8px;

            width: 8px;

            height: 8px;

            border-radius: 50%;

            background: var(--yellow);

        }

        .timeline {

            display: flex;

            gap: 2px;

            height: 9px;

            margin: 16px 0 8px;

        }

        .timeline-seg {

            flex: 1;

            min-width: 0;

            border-radius: 2px;

            background: var(--empty);

        }

        .timeline-seg.current {

            outline: 1px solid var(--text-color);

            outline-offset: 1px;

        }

        .ticks {

            display: flex;

            justify-content: space-between;

            font-size: 10px;

            color: var(--muted-color);

            margin-bottom: 16px;

        }

        .period-row {

            display: flex;

            justify-content: space-between;

            align-items: center;

            gap: 8px;

            padding: 10px 0;

            border-bottom: 1px solid var(--line-color);

            font-size: 13px;

        }

        .period-row:last-child { border-bottom: none; }

        .period-time {

            font-weight: 600;

            display: flex;

            align-items: center;

            gap: 6px;

            white-space: nowrap;

        }

        .period-row .detail {

            text-align: right;

        }

        .btn-refresh {

            width: 100%;

            padding: 13px;

            border-radius: 10px;

            border: 1px solid var(--line-color);

            background: var(--panel-bg);

            color: var(--text-color);

            font-weight: 600;

            margin-top: 6px;

        }

        .btn-refresh:disabled {

            opacity: .6;

        }

    </style>

</head>

<body>

    <div class="header">

        <div>

            <h1>POWER / KYIV</h1>

            <span id="update-label" class="detail">YASNO · Завантаження</span>

        </div>

        <select id="group-select" class="group-select"

                aria-label="Вибір черги">

            <option value="35.1">Черга 35.1</option>

        </select>

    </div>

    <div class="tabs">

        <button id="tab-today" class="tab-btn active"

                onclick="switchDay('today')">Сьогодні</button>

        <button id="tab-tomorrow" class="tab-btn"

                onclick="switchDay('tomorrow')">Завтра</button>

    </div>

    <div class="card">

        <div class="headline">

            <span id="status-dot" class="badge"></span>

            <span id="headline-text">Завантаження...</span>

        </div>

        <div id="detail-text" class="detail">Отримання графіка...</div>

        <div id="timeline-bar" class="timeline"></div>

        <div class="ticks">

            <span>00</span><span>06</span><span>12</span>

            <span>18</span><span>24</span>

        </div>

    </div>

    <div class="card">

        <div style="font-size:12px;font-weight:600;color:var(--muted-color);margin-bottom:8px">

            ПЕРІОДИ ВІДКЛЮЧЕНЬ

        </div>

        <div id="intervals-container" class="detail">

            Завантаження...

        </div>

    </div>

    <button id="refresh-button" class="btn-refresh"

            onclick="loadDashboard()">↻ Оновити дані</button>

    <script>

        const tg = window.Telegram?.WebApp;

        if (tg) {

            tg.ready();

            tg.expand();

        }

        const SERVER = "https://svitlo-bot-ysac.onrender.com";

        const REFRESH_MS = 60000;

        let currentDay = "today";

        let loading = false;

        let refreshTimer = null;

        const $ = id => document.getElementById(id);

        function readSavedGroup() {

            try {

                return localStorage.getItem("selected_group") || "35.1";

            } catch {

                return "35.1";

            }

        }

        let currentGroup = readSavedGroup();

        // Київський час незалежно від часового поясу пристрою.

        function kyivParts() {

            const parts = new Intl.DateTimeFormat("en-GB", {

                timeZone: "Europe/Kyiv",

                hour: "2-digit",

                minute: "2-digit",

                hourCycle: "h23"

            }).formatToParts(new Date());

            const get = type => Number(

                parts.find(p => p.type === type)?.value || 0

            );

            return { hour: get("hour"), minute: get("minute") };

        }

        function kyivTimeLabel() {

            return new Intl.DateTimeFormat("uk-UA", {

                timeZone: "Europe/Kyiv",

                hour: "2-digit",

                minute: "2-digit",

                hourCycle: "h23"

            }).format(new Date());

        }

        function hhmm(minutes) {

            const h = Math.floor(minutes / 60);

            const m = minutes % 60;

            return `${String(h).padStart(2, "0")}:${String(m).padStart(2, "0")}`;

        }

        function normalizeType(slot) {

            return String(slot?.type || "")

                .toLowerCase()

                .replace(/[\s_-]/g, "");

        }

        function isOutage(slot) {

            return normalizeType(slot) === "definite";

        }

        function isNotPlanned(slot) {

            return normalizeType(slot) === "notplanned";

        }

        function validSlot(slot) {

            return Number.isFinite(slot?.start) &&

                Number.isFinite(slot?.end) &&

                slot.start >= 0 &&

                slot.end <= 1440 &&

                slot.end > slot.start;

        }

        function setError(message) {

            $("status-dot").style.backgroundColor = "var(--yellow)";

            $("headline-text").innerText = "Немає актуальних даних";

            $("detail-text").innerText = message;

            $("timeline-bar").replaceChildren();

            $("intervals-container").innerText = message;

        }

        async function apiGet(path) {

            const response = await fetch(

                `${SERVER}${path}`,

                { cache: "no-store" }

            );

            if (!response.ok) {

                throw new Error(`Помилка сервера: HTTP ${response.status}`);

            }

            return response.json();

        }

        async function fetchGroupsList() {

            try {

                const data = await apiGet("/groups");

                if (!Array.isArray(data.groups) || data.groups.length === 0) {

                    return;

                }

                const select = $("group-select");

                select.replaceChildren();

                data.groups.forEach(group => {

                    const option = document.createElement("option");

                    option.value = String(group);

                    option.textContent = `Черга ${group}`;

                    select.appendChild(option);

                });

                if (data.groups.map(String).includes(currentGroup)) {

                    select.value = currentGroup;

                } else {

                    currentGroup = String(data.groups[0]);

                    select.value = currentGroup;

                    saveGroup();

                }

            } catch (error) {

                console.error("Не вдалося завантажити черги:", error);

                // Якщо /groups недоступний, залишаємо поточний варіант.

            }

        }

        function saveGroup() {

            try {

                localStorage.setItem("selected_group", currentGroup);

            } catch {}

        }

        function switchDay(day) {

            currentDay = day;

            $("tab-today").classList.toggle("active", day === "today");

            $("tab-tomorrow").classList.toggle("active", day === "tomorrow");

            loadDashboard();

        }

        $("group-select").addEventListener("change", event => {

            currentGroup = event.target.value;

            saveGroup();

            loadDashboard();

        });

        function mergeSlots(slots) {

            const sorted = slots

                .filter(s => isOutage(s) || isNotPlanned(s))

                .filter(validSlot)

                .map(s => ({

                    start: s.start,

                    end: s.end,

                    isOff: isOutage(s)

                }))

                .sort((a, b) => a.start - b.start);

            const result = [];

            for (const slot of sorted) {

                const last = result[result.length - 1];

                if (last && last.end === slot.start &&

                    last.isOff === slot.isOff) {

                    last.end = slot.end;

                } else {

                    result.push({ ...slot });

                }

            }

            return result;

        }

        function renderTimeline(slots, nowMinutes) {

            const bar = $("timeline-bar");

            bar.replaceChildren();

            const currentHour = currentDay === "today"

                ? Math.floor(nowMinutes / 60)

                : -1;

            for (let hour = 0; hour < 24; hour++) {

                const start = hour * 60;

                const end = start + 60;

                const segment = document.createElement("div");

                segment.className = "timeline-seg";

                if (hour === currentHour) {

                    segment.classList.add("current");

                }

                const matches = slots.filter(s =>

                    s.start < end && s.end > start

                );

                if (matches.some(isOutage)) {

                    segment.style.backgroundColor = "var(--red)";

                } else if (

                    matches.length > 0 &&

                    matches.every(isNotPlanned)

                ) {

                    segment.style.backgroundColor = "var(--green)";

                } else {

                    segment.style.backgroundColor = "var(--yellow)";

                }

                bar.appendChild(segment);

            }

        }

        function renderIntervals(slots, nowMinutes) {

            const container = $("intervals-container");

            container.replaceChildren();

            let intervals = mergeSlots(slots);

            if (currentDay === "today") {

                intervals = intervals.filter(i => i.end > nowMinutes);

            }

            if (intervals.length === 0) {

                container.textContent = currentDay === "today"

                    ? "Подальших визначених періодів у графіку немає."

                    : "Визначених періодів у графіку немає.";

                return;

            }

            intervals.forEach(interval => {

                const row = document.createElement("div");

                row.className = "period-row";

                const time = document.createElement("div");

                time.className = "period-time";

                const dot = document.createElement("span");

                dot.className = "badge";

                dot.style.backgroundColor = interval.isOff

                    ? "var(--red)"

                    : "var(--green)";

                time.append(dot);

                time.append(

                    document.createTextNode(

                        `${hhmm(interval.start)}–${hhmm(interval.end)}`

                    )

                );

                const label = document.createElement("span");

                label.className = "detail";

                label.textContent = interval.isOff

                    ? "Відключення"

                    : "Світло є за графіком";

                row.append(time, label);

                container.appendChild(row);

            });

        }

        async function loadDashboard() {

            if (loading) return;

            loading = true;

            $("refresh-button").disabled = true;

            try {

                const params = new URLSearchParams({

                    group: currentGroup,

                    day: currentDay

                });

                const data = await apiGet(`/schedule?${params.toString()}`);

                if (data.error) {

                    setError(data.error);

                    return;

                }

                if (!Array.isArray(data.slots)) {

                    throw new Error("Сервер повернув графік у невідомому форматі.");

                }

                const slots = data.slots.filter(validSlot);

                const { hour, minute } = kyivParts();

                const nowMinutes = hour * 60 + minute;

                $("update-label").textContent =

                    `YASNO · ${kyivTimeLabel()}`;

                const hasSchedule = data.status &&

                    ["WaitingForSchedule", "ScheduleApplies",

                     "NoShutdowns", "PlannedShutdowns"]

                        .includes(data.status);

                if (data.status === "EmergencyShutdowns") {

                    $("status-dot").style.backgroundColor = "var(--yellow)";

                    $("headline-text").textContent = "Аварійний режим";

                    $("detail-text").textContent =

                        "Звичайний графік може не відповідати фактичним відключенням.";

                } else if (currentDay === "today") {

                    const active = slots.find(s =>

                        isOutage(s) &&

                        nowMinutes >= s.start &&

                        nowMinutes < s.end

                    );

                    const next = slots

                        .filter(s => isOutage(s) && s.start > nowMinutes)

                        .sort((a, b) => a.start - b.start)[0];

                    if (active) {

                        $("status-dot").style.backgroundColor = "var(--red)";

                        $("headline-text").textContent = "Відключення за графіком";

                        $("detail-text").textContent =

                            `За графіком до ${hhmm(active.end)}`;

                    } else if (hasSchedule) {

                        $("status-dot").style.backgroundColor = "var(--green)";

                        $("headline-text").textContent = "Світло має бути";

                        $("detail-text").textContent = next

                            ? `Наступне відключення за графіком о ${hhmm(next.start)}`

                            : "Подальших запланованих відключень немає";

                    } else {

                        $("status-dot").style.backgroundColor = "var(--yellow)";

                        $("headline-text").textContent = "Перевір статус графіка";

                        $("detail-text").textContent =

                            "YASNO не підтвердив застосування цього графіка.";

                    }

                } else {

                    $("status-dot").style.backgroundColor = "var(--yellow)";

                    $("headline-text").textContent = "Графік на завтра";

                    $("detail-text").textContent =

                        `Черга ${currentGroup}` +

                        (data.status ? ` · ${data.status}` : "");

                }

                renderTimeline(slots, nowMinutes);

                renderIntervals(slots, nowMinutes);

                if (data.updatedOn) {

                    $("update-label").textContent =

                        `YASNO · Оновлено ${data.updatedOn}`;

                }

            } catch (error) {

                console.error("Помилка завантаження графіка:", error);

                setError(

                    "Не вдалося отримати графік. Перевірте підключення " +

                    "або спробуйте оновити дані пізніше."

                );

            } finally {

                loading = false;

                $("refresh-button").disabled = false;

            }

        }

        async function init() {

            await fetchGroupsList();

            await loadDashboard();

            if (refreshTimer) clearInterval(refreshTimer);

            refreshTimer = setInterval(loadDashboard, REFRESH_MS);

        }

        init();

    </script>

</body>

</html>
